<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Chip Cookies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .recipe-box {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #744210;
            text-align: center;
        }
        h2 {
            color: #975a16;
            border-bottom: 2px solid #fbd38d;
            padding-bottom: 8px;
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        ul, ol {
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="recipe-box">
        <h1>Classic Chocolate Chip Cookies</h1>
        <img src="https://via.placeholder.com/600x300?text=Cookies" alt="A plate of chocolate chip cookies">

        <h2>Ingredients</h2>
        <ul>
            <li>2 cups of flour</li>
            <li>1 cup of butter</li>
            <li>1 cup of chocolate chips</li>
            <li>1/2 cup of sugar</li>
        </ul>

        <h2>Instructions</h2>
        <ol>
            <li>Preheat the oven to 350 degrees.</li>
            <li>Mix the butter and sugar together.</li>
            <li>Add the flour and chocolate chips.</li>
            <li>Bake for 10 minutes.</li>
        </ol>
    </div>

</body>
</html>
