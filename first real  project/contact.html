<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #1e293b;
            text-align: center;
            margin-top: 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h1>Contact Me</h1>
        <form>
            <label for="userName">Name:</label>
            <input type="text" id="userName" name="userName" placeholder="Your name">

            <label for="userEmail">Email:</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="you@example.com">

            <label for="userMessage">Message:</label>
            <textarea id="userMessage" name="userMessage" rows="5" placeholder="Write your message here..."></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
